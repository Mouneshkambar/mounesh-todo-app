<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A JavaScript To-Do List with CRUD, filtering, and localStorage persistence">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="todo-card">
            <header class="header">
                <p class="eyebrow">JavaScript Task Manager</p>
                <h1>My To-Do List</h1>
                <p class="subtitle">Create, manage, filter, and save your tasks.</p>
            </header>

            <form id="taskForm" class="task-input" autocomplete="off">
                <label for="taskInput" class="sr-only">Task</label>
                <input id="taskInput" type="text" maxlength="200" placeholder="Enter a task..." aria-label="Enter a task">
                <button id="addTaskBtn" type="submit">Add Task</button>
            </form>

            <div class="toolbar">
                <div class="filters" role="group" aria-label="Task filters">
                    <button type="button" class="filter-btn active" data-filter="all">All</button>
                    <button type="button" class="filter-btn" data-filter="active">Active</button>
                    <button type="button" class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <span id="taskCount" class="task-count">0 tasks</span>
            </div>

            <ul id="taskList" class="task-list" aria-live="polite"></ul>

            <div id="emptyMessage" class="empty-message">
                <div class="empty-icon">✓</div>
                <h2>No tasks yet</h2>
                <p>Add your first task above.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
